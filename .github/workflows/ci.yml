name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run verify:static

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # The specs build the app and serve it (playwright.config.ts), so this runs the same build
      # the checks job verifies, in desktop Chromium.
      # The github reporter turns each failing test into an annotation on this job, so a failure
      # names the test and its message without downloading the logs.
      - run: npm run test:e2e -- --reporter=list,github
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: browser-test-results
          path: test-results
          retention-days: 7
