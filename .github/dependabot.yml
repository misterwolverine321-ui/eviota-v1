version: 2
updates:
  # The four actions the Pages workflow uses.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # npm: minor and patch updates arrive together in one weekly pull request. Major versions are not
  # proposed: they are taken by hand, in a checkpoint of their own, with the whole suite run.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Pinned exactly on purpose. Their notices (public/THIRD_PARTY_NOTICES.txt, the vendored
      # copies in public/vendor) describe one version; change them by hand, then run
      # `npm run notices` and read the diff.
      - dependency-name: djvu-rs
      - dependency-name: tesseract.js
      - dependency-name: tesseract.js-core
